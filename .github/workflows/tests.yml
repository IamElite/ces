name: Tests

on:
  push:
    branches: [main, dev, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile skills/ces/workflow.py tests/test_workflow.py
      - name: Validate CES configuration
        run: python skills/ces/workflow.py validate
      - name: Run test suite
        run: python -m unittest discover -s tests -v
